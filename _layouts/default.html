<!DOCTYPE html>
<html lang="{{ page.lang | default: 'es' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta property="og:title" content="{{ page.title }} - {{ site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:type" content="website">
    <title>{{ page.title }} - {{ site.title }}</title>
    
    <!-- CSS modularizado -->
    <link rel="stylesheet" href="{{ '/style/variables.css?v=2' | relative_url }}">
    <link rel="stylesheet" href="{{ '/style/layout.css?v=2' | relative_url }}">
    <link rel="stylesheet" href="{{ '/style/components.css?v=2' | relative_url }}">
    
    {% if page.is_home %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Restaurant",
      "name": "Taberna Iberlanda",
      "image": "https://iberlanda.eus/assets/fachada.jpg",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Arrankudiaga",
        "addressRegion": "Bizkaia",
        "addressCountry": "ES"
      },
      "telephone": "+34676074839",
      "servesCuisine": "Tradicional, Platos Combinados, Hamburguesas",
      "openingHours": "Mo,Tu,We,Th 08:00-23:00, Fr,Sa 08:00-01:00, Su 09:00-23:00"
    }
    </script>
    {% endif %}
</head>
<body>
    {% include header.html %}
    
    <main {% if page.main_class %}class="{{ page.main_class }}"{% endif %}>
        {{ content }}
    </main>

    {% include footer.html %}
    {% include cookies.html %}
    
    <script src="{{ '/funciones/menu.js' | relative_url }}" defer></script>
    <script src="{{ '/funciones/cookies.js' | relative_url }}" defer></script>
    <script src="{{ '/funciones/añoCopy.js' | relative_url }}" defer></script>
    {% if page.custom_js %}
    <script src="{{ '/funciones/' | append: page.custom_js | relative_url }}" defer></script>
    {% endif %}
</body>
</html>
