        <div class="opciones-servicio">

            <label>
                <input type="radio" name="tipoServicio" value="reserva" checked>
                Reserva de Mesa
            </label>

            <label>
                <input type="radio" name="tipoServicio" value="encargo">
                Encargo de Comida
            </label>

        </div>

        <div id="formReserva">
            <h1>Reserva tu mesa:</h1>

            <form class="formulario-reserva">

                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" required>

                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" required>

                <label for="personas">Personas</label>
                <input type="number" id="personas" min="1" required>

                <label for="fecha">Fecha</label>
                <input type="date" id="fecha" required>

                <label for="mensaje">Observaciones</label>
                <textarea id="mensaje"></textarea>

                <button type="submit">Solicitar Reserva</button>
            </form>
        </div>

        <div id="formEncargo" style="display:none;">
            <h1>Por encargo:</h1>

            <form class="formulario-reserva">

                <label for="nombreEncargo">Nombre</label>
                <input type="text" id="nombreEncargo" required>

                <label for="telefonoEncargo">Teléfono</label>
                <input type="tel" id="telefonoEncargo" required>

                <label for="producto">Producto</label>

                <select id="producto">

                    <option>Codillo</option>
                    <option>Pollo Asado</option>
                    <option>Tortilla de Patatas</option>
                    <option>Alubias rojas con sacramentos</option>
                    <option>Bacalao a la vizcaína</option>
                    <option>Bacalao al pil-pil</option>
                    <option>Paella de marisco</option>
                    <option>Paella de carne</option>

                </select>

                <label for="cantidad">Cantidad</label>
                <input type="number" id="cantidad" min="1" value="1">

                <label for="fechaRecogida">
                    Fecha de recogida
                </label>

                <input type="date" id="fechaRecogida" required>

                <label for="observacionesEncargo">
                    Observaciones
                </label>

                <textarea id="observacionesEncargo"></textarea>

                <button type="submit">
                    Solicitar Encargo
                </button>

            </form>

        </div>
